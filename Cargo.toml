[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/peerspan-core",
    "crates/peerspan-media",
    "crates/peerspan-protocol",
    "crates/peerspan-video",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
